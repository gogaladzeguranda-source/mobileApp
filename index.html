<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glow Routine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2b2350">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: single phone column, a big AM/PM switch as the hero, step list below, bottom tab bar. */
:root {
  --bg: #f6f4fa;
  --surface: #ffffff;
  --fg: #221d38;
  --muted: #6e6886;
  --line: #e4e0ee;
  --am: #f19a5b;        /* sunrise */
  --am-soft: #fde9da;
  --pm: #4b3f9e;        /* night */
  --pm-soft: #e6e2f7;
  --accent: var(--am);
  --accent-soft: var(--am-soft);
  --ok: #2f8f6b;
  --warn: #b5562a;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15121f; --surface: #201c2e; --fg: #efecf8; --muted: #a59fbd; --line: #322c45;
    --am: #f5a974; --am-soft: #3a2a22; --pm: #a99cf5; --pm-soft: #2a2546;
    --ok: #6bd0a6; --warn: #f09a6f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15121f; --surface: #201c2e; --fg: #efecf8; --muted: #a59fbd; --line: #322c45;
  --am: #f5a974; --am-soft: #3a2a22; --pm: #a99cf5; --pm-soft: #2a2546;
  --ok: #6bd0a6; --warn: #f09a6f; color-scheme: dark;
}
body.is-pm { --accent: var(--pm); --accent-soft: var(--pm-soft); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.9rem; line-height: 1.1; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1rem; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
small, .small { font-size: .82rem; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn {
  border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600;
  background: var(--fg); color: var(--bg);
}
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.accent { background: var(--accent); color: #1b1530; }
body.is-pm .btn.accent { color: #fff; }
:root[data-theme="dark"] body.is-pm .btn.accent { color: #15121f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.is-pm .btn.accent { color: #15121f; } }
.btn.small { padding: 6px 12px; font-size: .85rem; }
.btn.danger { background: transparent; color: var(--warn); border: 1px solid var(--line); }

/* Header */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.date { font-variant-numeric: tabular-nums; }

/* AM / PM switch */
.switch {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
}
.switch button {
  border: 0; border-radius: 13px; padding: 12px 10px; background: transparent;
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
}
.switch button .t { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; }
.switch button .s { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.switch button[aria-pressed="true"][data-slot="am"] { background: var(--am-soft); }
.switch button[aria-pressed="true"][data-slot="pm"] { background: var(--pm-soft); }
.switch .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.switch [data-slot="am"] .dot { background: var(--am); }
.switch [data-slot="pm"] .dot { background: var(--pm); }

/* Progress */
.progress { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.count { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 3.5em; text-align: right; }

/* Steps */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.step {
  display: grid; grid-template-columns: 30px 44px 1fr; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; cursor: pointer; user-select: none;
}
.step .n {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  border: 2px solid var(--accent); font-weight: 700; font-size: .85rem; font-variant-numeric: tabular-nums;
}
.step.done .n { background: var(--accent); color: var(--surface); }
.step.done .name { text-decoration: line-through; color: var(--muted); }
.step .body { min-width: 0; }
.step .name { font-weight: 600; overflow-wrap: anywhere; }
.step .meta { font-size: .8rem; color: var(--muted); }
.step .tip { font-size: .8rem; color: var(--warn); }
.thumb {
  width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--accent-soft);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; color: var(--fg);
}
.notes { background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; font-size: .88rem; display: flex; flex-direction: column; gap: 4px; }
.notes p { margin: 0; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day { text-align: center; padding: 8px 2px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: .72rem; }
.day b { display: block; font-size: .8rem; }
.day.today { border-color: var(--accent); }
.tag { display: inline-block; font-size: .64rem; font-weight: 600; padding: 1px 5px; border-radius: 6px; margin-top: 3px; }
.tag.r { background: var(--pm-soft); color: var(--pm); }
.tag.x { background: var(--am-soft); color: var(--warn); }
.tag.m { background: var(--line); color: var(--muted); }
.tag.rest { color: var(--muted); }

/* Products */
.plist { display: flex; flex-direction: column; gap: 8px; }
.prod {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px;
}
.prod .body { min-width: 0; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font-size: .7rem; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.am { background: var(--am-soft); border-color: transparent; color: var(--fg); }
.chip.pm { background: var(--pm-soft); border-color: transparent; color: var(--fg); }

.prod.pending { border-style: dashed; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); display: inline-block; vertical-align: -3px; margin-right: 6px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.chip.check { border-color: var(--warn); color: var(--warn); }
.hero-add { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.hero-add .row .btn { flex: 1 1 auto; text-align: center; }

.empty { text-align: center; padding: 28px 16px; border: 1.5px dashed var(--line); border-radius: var(--radius); display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* Forms */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-size: .82rem; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="time"], select, textarea {
  width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
}
textarea { min-height: 64px; resize: vertical; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .field { flex: 1 1 140px; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 6px 12px; font-size: .85rem; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.photo-pick { display: flex; gap: 12px; align-items: center; }
.photo-pick .thumb { width: 64px; height: 64px; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--pm); }

/* Tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabs button { border: 0; background: none; padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .75rem; color: var(--muted); font-weight: 600; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-selected="true"] { color: var(--fg); }
.fab {
  position: fixed; z-index: 6;
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px);
  bottom: calc(74px + env(safe-area-inset-bottom, 0px));
  width: 56px; height: 56px; border-radius: 50%; border: 0;
  background: var(--fg); color: var(--bg); font-size: 28px; line-height: 1;
  box-shadow: 0 6px 20px rgba(20, 15, 40, .25);
}

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: .88rem;
  max-width: calc(100% - 32px);
}
.sheet-bg { position: fixed; inset: 0; background: rgba(15, 10, 30, .45); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto;
  border-radius: 20px 20px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); padding: 10px 12px; border-radius: 10px; }
.pre { font-family: ui-monospace, Menlo, monospace; font-size: .75rem; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; max-height: 120px; overflow: auto; }

[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app"></main>

<button class="fab" id="fab" aria-label="Add products from photos" hidden>+</button>
<input id="bulkPhotos" type="file" accept="image/*" multiple hidden>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Routine
    </button>
    <button role="tab" data-tab="products" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="5" rx="1"/><path d="M7 7h10v13a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/><path d="M7 12h10"/></svg>
      Products
    </button>
    <button role="tab" data-tab="settings" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
      Reminders
    </button>
  </div>
</nav>

<div id="toast" class="toast" hidden></div>
<div id="sheet" class="sheet-bg" hidden></div>

<script>
(() => {
"use strict";

/* ---------- Skincare knowledge ----------
   order = position in the layering sequence (thin to thick, SPF last).
   am / pm = whether this category belongs in that routine by default.
   cycle = night-only actives that rotate through the week. */
const CATS = {
  oilcleanser: { label: "Oil / balm cleanser", order: 5,  am: false, pm: true,  hint: "First cleanse to melt sunscreen and makeup" },
  cleanser:    { label: "Cleanser",            order: 10, am: true,  pm: true,  hint: "Massage 60 seconds, rinse with lukewarm water" },
  exfoliant:   { label: "Exfoliant (AHA / BHA)", order: 20, am: false, pm: true, cycle: "exfoliant", hint: "Apply to dry skin, wait a few minutes" },
  mask:        { label: "Mask",                order: 25, am: false, pm: true,  cycle: "mask", hint: "Rinse off before the next step" },
  toner:       { label: "Toner / essence",     order: 30, am: true,  pm: true,  hint: "Pat in with hands" },
  vitc:        { label: "Vitamin C serum",     order: 40, am: true,  pm: false, hint: "Antioxidant boost under sunscreen" },
  retinoid:    { label: "Retinol / retinoid",  order: 45, am: false, pm: true,  cycle: "retinoid", hint: "Pea-sized amount, avoid eye corners" },
  serum:       { label: "Serum (hyaluronic, niacinamide…)", order: 50, am: true, pm: true, hint: "" },
  treatment:   { label: "Spot treatment",      order: 55, am: false, pm: true,  hint: "Only on blemishes" },
  eye:         { label: "Eye cream",           order: 60, am: true,  pm: true,  hint: "Tap gently with ring finger" },
  moisturizer: { label: "Moisturizer",         order: 70, am: true,  pm: true,  hint: "" },
  oil:         { label: "Face oil",            order: 80, am: false, pm: true,  hint: "A few drops, press over moisturizer" },
  spf:         { label: "Sunscreen (SPF)",     order: 90, am: true,  pm: false, hint: "Two finger lengths for face and neck" },
  lip:         { label: "Lip care",            order: 95, am: true,  pm: true,  hint: "" },
  other:       { label: "Other",               order: 65, am: true,  pm: true,  hint: "" },
};
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

const DEFAULTS = {
  products: [],
  settings: {
    amTime: "08:00", pmTime: "21:30", remind: false,
    retinoidDays: [1, 3, 6],   // Mon Wed Sat
    exfoliantDays: [2, 5],     // Tue Fri
    maskDays: [0],             // Sun
  },
  log: {},          // { "2026-10-14": { am: [ids], pm: [ids] } }
  notified: {},     // { "2026-10-14-am": true }
};

/* ---------- Storage ---------- */
const KEY = "glow-routine-v1";
let state;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      return { ...structuredClone(DEFAULTS), ...s, settings: { ...DEFAULTS.settings, ...(s.settings || {}) } };
    }
  } catch (e) { /* storage unavailable */ }
  return null;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}
state = load();
const firstRun = !state;
if (!state) {
  state = structuredClone(DEFAULTS);
  state.products = sampleProducts();
}

function sampleProducts() {
  const mk = (name, brand, category) => ({ id: uid(), name, brand, category, when: "auto", photo: "", notes: "", sample: true });
  return [
    mk("Gentle Foaming Cleanser", "Example", "cleanser"),
    mk("Hyaluronic Acid Serum", "Example", "serum"),
    mk("Vitamin C 15%", "Example", "vitc"),
    mk("Retinol 0.2%", "Example", "retinoid"),
    mk("Glycolic Toner 7%", "Example", "exfoliant"),
    mk("Daily Moisturizer", "Example", "moisturizer"),
    mk("Sunscreen SPF 50", "Example", "spf"),
  ];
}

/* ---------- Helpers ---------- */
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function dkey(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function minutes(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }
function fmtTime(hhmm) {
  const d = new Date(); const [h, m] = hhmm.split(":").map(Number); d.setHours(h, m, 0, 0);
  return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
function initials(name) { return (name || "?").split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase(); }
function thumb(p) {
  return p.photo ? `<img class="thumb" src="${p.photo}" alt="">` : `<span class="thumb" aria-hidden="true">${esc(initials(p.name))}</span>`;
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2400);
}

/* ---------- Routine builder ---------- */
function slotsFor(p) {
  const c = CATS[p.category] || CATS.other;
  if (p.when === "am") return { am: true, pm: false };
  if (p.when === "pm") return { am: false, pm: true };
  if (p.when === "both") return { am: true, pm: true };
  return { am: c.am, pm: c.pm };
}

/* Which rotating active is scheduled for a given weekday's evening. */
function nightPlan(dow) {
  const s = state.settings;
  const has = cat => state.products.some(p => p.category === cat && slotsFor(p).pm);
  const plan = { retinoid: false, exfoliant: false, mask: false };
  if (has("retinoid") && s.retinoidDays.includes(dow)) plan.retinoid = true;
  // Never stack acids with a retinoid on the same night.
  if (has("exfoliant") && s.exfoliantDays.includes(dow) && !plan.retinoid) plan.exfoliant = true;
  if (has("mask") && s.maskDays.includes(dow)) plan.mask = true;
  return plan;
}

function buildRoutine(slot, date = new Date()) {
  const dow = date.getDay();
  const plan = slot === "pm" ? nightPlan(dow) : null;
  const steps = state.products
    .filter(p => slotsFor(p)[slot])
    .filter(p => {
      const c = CATS[p.category] || CATS.other;
      if (slot === "pm" && c.cycle) return plan[c.cycle];
      return true;
    })
    .sort((a, b) => (CATS[a.category] || CATS.other).order - (CATS[b.category] || CATS.other).order);

  const notes = [];
  const cats = new Set(state.products.map(p => p.category));
  if (slot === "am" && !cats.has("spf") && state.products.length)
    notes.push("Add a sunscreen. It is the most important morning step, especially if you use retinol or acids.");
  if (slot === "am" && cats.has("vitc") && cats.has("exfoliant"))
    notes.push("Vitamin C stays in the morning and acids at night, so they don't irritate together.");
  if (slot === "pm" && plan) {
    if (plan.retinoid) notes.push(`Retinoid night (${DAYS[dow]}). Skip acids and scrubs tonight.`);
    else if (plan.exfoliant) notes.push(`Exfoliation night (${DAYS[dow]}). No retinoid tonight.`);
    else if (cats.has("retinoid") || cats.has("exfoliant")) notes.push("Recovery night: hydrate and repair, no strong actives.");
    if (plan.mask) notes.push("Mask night: use it after cleansing.");
  }
  if (slot === "pm" && cats.has("spf") && !cats.has("oilcleanser"))
    notes.push("Tip: an oil cleanser first helps remove sunscreen fully (double cleanse).");
  return { steps, notes };
}

/* ---------- Rendering ---------- */
let tab = "today";
let slot = new Date().getHours() >= 15 ? "pm" : "am";
const app = document.getElementById("app");

function render() {
  document.body.classList.toggle("is-pm", slot === "pm");
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  document.getElementById("fab").hidden = tab !== "products";
  if (tab === "today") renderToday();
  else if (tab === "products") renderProducts();
  else renderSettings();
}

function renderToday() {
  const now = new Date();
  const { steps, notes } = buildRoutine(slot, now);
  const done = new Set(((state.log[dkey(now)] || {})[slot]) || []);
  const n = steps.filter(s => done.has(s.id)).length;
  const pct = steps.length ? Math.round((n / steps.length) * 100) : 0;
  const s = state.settings;

  app.innerHTML = `
    <header class="top">
      <div>
        <div class="eyebrow date">${now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })}</div>

      </div>
    </header>

      <button data-slot="am" aria-pressed="${slot === "am"}"><span class="t"><span class="dot"></span>Morning</span><span class="s">Reminder ${fmtTime(s.amTime)}</span></button>

    </div>

      <div class="progress"><div class="bar"><i style="width:${pct}%"></i></div><span class="count">${n} / ${steps.length}</span></div>

function weekStrip(now) {
  const has = c => state.products.some(p => p.category === c);
  if (!has("retinoid") && !has("exfoliant") && !has("mask")) return "";
  const today = now.getDay();
  const order = [1, 2, 3, 4, 5, 6, 0];
  return `<section style="display:flex;flex-direction:column;gap:8px">
    <div class="eyebrow">Evening actives this week</div>
    <div class="week">${order.map(d => {
      const p = nightPlan(d);
      const tags = [p.retinoid && `<span class="tag r">Retinoid</span>`, p.exfoliant && `<span class="tag x">Acid</span>`, p.mask && `<span class="tag m">Mask</span>`].filter(Boolean);
      return `<div class="day ${d === today ? "today" : ""}"><b>${DAYS[d]}</b>${tags.join("<br>") || `<span class="tag rest">Rest</span>`}</div>`;
    }).join("")}</div>
    <span class="small muted">Change the days in Reminders.</span>
  </section>`;
}

function updateCatHint() {
  const el = document.getElementById("pcatHint"); if (!el) return;
  const c = CATS[document.getElementById("pcat").value];
  const where = c.am && c.pm ? "morning and evening" : c.am ? "mornings" : "evenings";
  el.textContent = `Recommended for ${where}${c.cycle ? ", on selected nights" : ""}.`;
}

async function loadImage(file) {
  const url = URL.createObjectURL(file);
  try { return await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; }); }
  finally { URL.revokeObjectURL(url); }
}
/* Square thumbnail kept with the product. */
function thumbFrom(img) {
  const size = 240, c = document.createElement("canvas"); c.width = c.height = size;
  const s = Math.min(img.width, img.height);
  c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
  return c.toDataURL("image/jpeg", 0.8);
}
/* Larger, uncropped copy sent to Claude so the whole label is readable. */
function labelFrom(img) {
  const max = 1200, k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
}
async function resizeImage(file) { return thumbFrom(await loadImage(file)); }

sheet.addEventListener("click", e => {
  if (e.target === sheet) return closeSheet();
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.act === "close") closeSheet();
  if (b.dataset.act === "rmphoto") { draft.photo = ""; document.getElementById("pthumb").innerHTML = thumb(draft); b.remove(); }
  if (b.dataset.v) { draft.when = b.dataset.v; b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }
  if (b.dataset.act === "del") {
    document.getElementById("delConfirm").innerHTML = `<div class="confirm"><span style="flex:1">Delete “${esc(draft.name)}”?</span><button type="button" class="btn small" data-act="del-yes">Delete</button><button type="button" class="btn ghost small" data-act="del-no">Keep</button></div>`;
  }
  if (b.dataset.act === "del-no") document.getElementById("delConfirm").innerHTML = "";
  if (b.dataset.act === "del-yes") {
    state.products = state.products.filter(p => p.id !== draft.id);
    save(); closeSheet(); render(); toast("Product deleted");
  }
});
sheet.addEventListener("change", async e => {
  if (e.target.id === "pcat") updateCatHint();
  if (e.target.id === "pphoto" && e.target.files[0]) {
    const file = e.target.files[0];
    try { draft.photo = await resizeImage(file); document.getElementById("pthumb").innerHTML = thumb(draft); }
    catch { return toast("That image couldn't be read. Try a JPG or PNG."); }
    // New product with an empty name: let Claude fill the form from the photo.
    if (aiMode !== "none" && !document.getElementById("pname").value.trim()) {
      const d = draft, nameEl = document.getElementById("pname");
      nameEl.placeholder = "Reading label…";
      try {
        const info = await identify(await labelFrom(await loadImage(file)));
        if (draft !== d) return;
        document.getElementById("pname").value = info.name;
        document.getElementById("pbrand").value = info.brand;
        document.getElementById("pcat").value = info.category; updateCatHint();
        if (!document.getElementById("pnotes").value) document.getElementById("pnotes").value = info.notes;
        d.when = info.when;
        document.querySelectorAll("#pwhen button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === info.when)));
        toast("Filled in from the photo. Check and save.");
      } catch (err) { if (draft === d) toast(err.message); }
      finally { if (draft === d) nameEl.placeholder = "e.g. Hydrating Cleanser"; }
    }
  }
});
sheet.addEventListener("submit", e => {
  e.preventDefault();
  draft.name = document.getElementById("pname").value.trim();
  if (!draft.name) return;
  draft.brand = document.getElementById("pbrand").value.trim();
  draft.category = document.getElementById("pcat").value;
  draft.notes = document.getElementById("pnotes").value.trim();

/* ---------- AI photo reading ----------
   Inside the Claude app the page asks Claude through the viewer (the person's own account).
   Installed on a phone, it calls the Claude API with the key saved in Reminders. */
let aiMode = "none";   // "claude" | "key" | "none"
let sampleFn = null;
async function detectAi() {
  if (!sampleFn && window.claude?.use) {
    try {
      const s = await window.claude.use("sample");
      if (s && (await s.limits().catch(() => ({}))).images) sampleFn = s;
    } catch { /* not available */ }
  }
  aiMode = sampleFn ? "claude" : state.settings.apiKey ? "key" : "none";
}

const CAT_KEYS = Object.keys(CATS);
const ID_PROMPT = `You are looking at a photo of one skincare product. Read the label and packaging and identify it.
Product types (use the key on the left):
${CAT_KEYS.map(k => `- ${k}: ${CATS[k].label}`).join("\n")}

Return only a JSON object with these fields:
- "name": the product name without the brand, as printed (e.g. "Hydrating Facial Cleanser")
- "brand": the brand, or "" if you can't tell
- "category": one key from the list above
- "when": "am" if the label says day/morning or it is a sunscreen, "pm" if it says night, otherwise "auto"
- "notes": one short usage tip for this product, at most 12 words (e.g. "Pea-sized amount, start 2 nights a week")
- "is_skincare": false if the photo does not show a skincare product
- "confidence": "high", "medium" or "low"`;

const ID_SCHEMA = {
  type: "object",
  properties: {
    name: { type: "string" }, brand: { type: "string" },
    category: { type: "string", enum: CAT_KEYS },
    when: { type: "string", enum: ["auto", "am", "pm"] },
    notes: { type: "string" }, is_skincare: { type: "boolean" },
    confidence: { type: "string", enum: ["high", "medium", "low"] },
  },
  required: ["name", "brand", "category", "when", "notes", "is_skincare", "confidence"],
  additionalProperties: false,
};

let sdkPromise = null;
async function askApi(blob) {
  sdkPromise ||= import("https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.126.0/+esm");
  const { default: Anthropic } = await sdkPromise;
  const client = new Anthropic({ apiKey: state.settings.apiKey, dangerouslyAllowBrowser: true });
  const data = await new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.readAsDataURL(blob); });
  const msg = await client.beta.messages.create({
    model: "claude-opus-5-5",
    max_tokens: 1024,
    betas: ["server-side-fallback-2026-07-01"],
    fallbacks: "default",
    output_config: { effort: "low", format: { type: "json_schema", schema: ID_SCHEMA } },
    messages: [{ role: "user", content: [
      { type: "image", source: { type: "base64", media_type: "image/jpeg", data } },
      { type: "text", text: ID_PROMPT },
    ] }],
  });
  if (msg.stop_reason === "refusal") throw new Error("Claude declined to read this photo.");
  const text = msg.content.filter(b => b.type === "text").map(b => b.text).join("");
  return JSON.parse(text);
}

function apiErrorText(e) {
  const st = e?.status;
  if (st === 401) return "Your API key wasn't accepted. Check it in Reminders.";
  if (st === 429) return "Too many photos at once. Wait a minute and try again.";
  if (st === 400 && /credit/i.test(e.message || "")) return "Your API account is out of credit.";
  return "Check your internet connection and try again.";
}
function sampleErrorText(e) {
  switch (e?.code) {
    case "not_granted": return "Claude wasn't allowed to read photos. Reopen the page to allow it.";
    case "rate_limited": return "Too many photos at once. Wait a minute and try again.";
    case "image_rejected": return "This photo couldn't be used. Try a clearer JPG.";
    case "refused": return "Claude declined to read this photo.";
    default: return "Claude couldn't read this photo. Try again.";
  }
}

async function identify(blob) {
  let r;
  if (aiMode === "claude") {
    try { r = await sampleFn.json(ID_PROMPT + "\n\nRespond with the JSON object only, no other text.", { images: [blob] }); }
    catch (e) { throw new Error(sampleErrorText(e)); }
  } else if (aiMode === "key") {
    try { r = await askApi(blob); }
    catch (e) { throw new Error(e instanceof SyntaxError ? "Claude's answer couldn't be read. Try again." : e.message?.startsWith("Claude") ? e.message : apiErrorText(e)); }
  } else throw new Error("Photo reading is off. Add an API key in Reminders.");
  if (!r || typeof r !== "object") throw new Error("Claude's answer couldn't be read. Try again.");
  if (r.is_skincare === false) throw new Error("This doesn't look like a skincare product.");
  return {
    name: String(r.name || "").trim() || "Unnamed product",
    brand: String(r.brand || "").trim(),
    category: CATS[r.category] ? r.category : "other",
    when: ["am", "pm"].includes(r.when) ? r.when : "auto",
    notes: String(r.notes || "").trim(),
    confidence: r.confidence || "medium",
  };
}

/* Queue of photos being read. Two at a time so a full shelf doesn't hit rate limits. */
let pending = [];
const bulkInput = document.getElementById("bulkPhotos");
async function addPhotos(files) {
  if (!files.length) return;
  if (tab !== "products") tab = "products";
  for (const file of files) {
    try {
      const img = await loadImage(file);
      pending.push({ key: uid(), thumb: thumbFrom(img), blob: await labelFrom(img), status: "queued" });
    } catch { toast("One photo couldn't be opened. Try a JPG or PNG."); }
  }
  if (aiMode === "none") {
    // No AI: keep each photo as a card the person fills in by hand.
    pending.forEach(j => { j.status = "error"; j.error = "Add an API key in Reminders, or fill it in yourself."; });
  }
  render();
  pumpQueue();
}
let running = 0;
function pumpQueue() {
  while (running < 2) {
    const job = pending.find(j => j.status === "queued");
    if (!job) return;
    job.status = "working"; running++; render();
    identify(job.blob).then(({ confidence, ...info }) => {
      state.products.push({ id: uid(), photo: job.thumb, ...info, aiCheck: confidence !== "high" });
      pending = pending.filter(j => j !== job);
      save(); toast(`Added ${info.brand ? info.brand + " " : ""}${info.name}`);
    }).catch(err => {
      job.status = "error"; job.error = err.message;
    }).finally(() => { running--; job.blob = job.status === "error" ? job.blob : null; if (tab === "products" && sheet.hidden) render(); pumpQueue(); });
  }
}

/* ---------- Main interactions ---------- */
function toggleStep(id) {
  const k = dkey();
  state.log[k] = state.log[k] || { am: [], pm: [] };
  const arr = state.log[k][slot] || (state.log[k][slot] = []);
  const i = arr.indexOf(id);
  if (i >= 0) arr.splice(i, 1); else arr.push(id);
  // keep only the last 60 days of history
  const keys = Object.keys(state.log).sort();
  while (keys.length > 60) delete state.log[keys.shift()];
  save(); render();
}

app.addEventListener("click", async e => {
  const step = e.target.closest(".step");
  if (step) return toggleStep(step.dataset.id);
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.slot) { slot = b.dataset.slot; render(); }
  if (b.dataset.go) { tab = b.dataset.go; render(); }
  if (b.dataset.manual) {
    const j = pending.find(x => x.key === b.dataset.manual);
    pending = pending.filter(x => x !== j); render();
    openSheet(null, { photo: j.thumb });
  }
  if (b.dataset.dismiss) { pending = pending.filter(x => x.key !== b.dataset.dismiss); render(); }
  if (b.dataset.edit) openSheet(state.products.find(p => p.id === b.dataset.edit));
  if (b.dataset.d) {
    const key = b.parentElement.dataset.days, d = Number(b.dataset.d), arr = state.settings[key];
    const i = arr.indexOf(d); if (i >= 0) arr.splice(i, 1); else arr.push(d);
    b.setAttribute("aria-pressed", String(i < 0)); save();
  }
  switch (b.dataset.act) {
    case "add": openSheet(null); break;
    case "photos": bulkInput.click(); break;
    case "rmkey": state.settings.apiKey = ""; save(); await detectAi(); renderSettings(); toast("Key removed"); break;
    case "clear-samples": state.products = state.products.filter(p => !p.sample); save(); render(); toast("Examples removed"); break;
    case "test": await notify("Test reminder", "Reminders are working."); break;
    case "ics": downloadIcs(); break;
    case "export": exportBackup(); break;
    case "import": showImport(); break;
    case "import-go": doImport(); break;
  }
});
app.addEventListener("keydown", e => {
  const step = e.target.closest(".step");
  if (step && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleStep(step.dataset.id); }
});
app.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "apiKey") {
    const v = t.value.trim();
    if (v && !v.includes("•")) { state.settings.apiKey = v; save(); await detectAi(); renderSettings(); toast("Key saved. Photo reading is on."); }
  }
  if (t.id === "amTime" || t.id === "pmTime") { state.settings[t.id] = t.value || state.settings[t.id]; save(); toast("Reminder time saved"); }
  if (t.id === "remind") {
    if (t.checked) {
      const p = await Notification.requestPermission();
      state.settings.remind = p === "granted";
      if (p !== "granted") toast("Notifications weren't allowed");
    } else state.settings.remind = false;
    save(); renderSettings();
  }
});
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  tab = b.dataset.tab; render(); window.scrollTo(0, 0);
});
document.getElementById("fab").addEventListener("click", () => bulkInput.click());
bulkInput.addEventListener("change", () => { addPhotos([...bulkInput.files]); bulkInput.value = ""; });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });

/* ---------- Reminders ---------- */
let swReg = null;
async function notify(title, body) {
  if (!("Notification" in window)) return toast("This browser can't show notifications");
  if (Notification.permission !== "granted") {
    const p = await Notification.requestPermission();
    if (p !== "granted") return toast("Allow notifications first");
  }
  const opts = { body, icon: "icons/icon-192.png", badge: "icons/icon-192.png", tag: "glow-" + title, vibrate: [120, 60, 120] };
  try {
    if (swReg) await swReg.showNotification(title, opts);
    else new Notification(title, opts);
  } catch { toast(title + ": " + body); }
}
function checkReminders() {
  if (!state.settings.remind) return;
  const now = new Date(), k = dkey(now), m = now.getHours() * 60 + now.getMinutes();
  for (const sl of ["am", "pm"]) {
    const at = minutes(state.settings[sl + "Time"]);
    const id = `${k}-${sl}`;
    // fire once, within 3 hours after the set time, only if routine not finished
    if (m >= at && m < at + 180 && !state.notified[id]) {
      const { steps } = buildRoutine(sl, now);
      const done = ((state.log[k] || {})[sl] || []).length;
      state.notified[id] = true;
      for (const old of Object.keys(state.notified)) if (!old.startsWith(k)) delete state.notified[old];
      save();
      if (steps.length && done < steps.length)
        notify(sl === "am" ? "Morning skincare" : "Evening skincare", `${steps.length} steps: ${steps.slice(0, 3).map(s => s.name).join(", ")}${steps.length > 3 ? "…" : ""}`);
    }
  }
}

function icsText() {
  const s = state.settings, today = dkey().replace(/-/g, "");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const ev = (sl, label) => {
    const t = s[sl + "Time"].replace(":", "") + "00";
    const { steps } = buildRoutine(sl);
    const desc = steps.map((p, i) => `${i + 1}. ${p.name}`).join("\\n") || "Open Glow Routine";
    return [
      "BEGIN:VEVENT", `UID:glow-${sl}-${today}@glowroutine`, `DTSTAMP:${stamp}`,
      `DTSTART:${today}T${t}`, "DURATION:PT10M", "RRULE:FREQ=DAILY",
      `SUMMARY:${label}`, `DESCRIPTION:${desc.replace(/[,;]/g, m => "\\" + m)}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${label}`, "TRIGGER:PT0M", "END:VALARM",
      "END:VEVENT",
    ].join("\r\n");
  };
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Glow Routine//EN", "CALSCALE:GREGORIAN",
    ev("am", "Morning skincare routine"), ev("pm", "Evening skincare routine"), "END:VCALENDAR"].join("\r\n");
}
function downloadIcs() {
  const text = icsText();
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/calendar" }));
    a.download = "skincare-reminders.ics";
    document.body.appendChild(a); a.click(); a.remove();
    toast("Open the downloaded file to add it to your calendar");
  } catch { /* fall through */ }
  document.getElementById("icsOut").innerHTML = `<p class="small muted" style="margin:0">If nothing downloaded, save this text as <b>skincare-reminders.ics</b> and open it:</p><div class="pre">${esc(text)}</div>`;
}

/* ---------- Backup ---------- */
async function exportBackup() {
  const { apiKey, ...settings } = state.settings;
  const text = JSON.stringify({ products: state.products, settings });
  const out = document.getElementById("backupOut");
  try { await navigator.clipboard.writeText(text); toast("Backup copied. Paste it somewhere safe."); }
  catch { out.innerHTML = `<p class="small muted" style="margin:0">Select and copy this text:</p><textarea id="bk" readonly>${esc(text)}</textarea>`; document.getElementById("bk").select(); }
}
function showImport() {
  document.getElementById("backupOut").innerHTML = `<div class="field"><label for="bkin">Paste your backup</label><textarea id="bkin"></textarea></div><button class="btn small" data-act="import-go">Restore</button>`;
}
function doImport() {
  try {
    const d = JSON.parse(document.getElementById("bkin").value);
    if (!Array.isArray(d.products)) throw 0;
    state.products = d.products; state.settings = { ...DEFAULTS.settings, ...(d.settings || {}), apiKey: state.settings.apiKey };
    save(); toast(`Restored ${d.products.length} products`); render();
  } catch { toast("That doesn't look like a Glow Routine backup"); }
}

/* ---------- Boot ---------- */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").then(r => (swReg = r)).catch(() => {});
}
try { navigator.storage?.persist?.(); } catch { /* not supported */ }
render();
detectAi().then(() => { if (tab !== "today") render(); });
if (firstRun) save();
checkReminders();
setInterval(checkReminders, 30 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkReminders(); if (tab === "today") render(); } });
})();
</script>
</body>
</html>
